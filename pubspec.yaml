name: fraudroko_app
description: "FraudRoko - Cyber Security Companion"
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.5

  # Device Information
  device_info_plus: ^11.5.0

  # App Information
  package_info_plus: ^9.0.0

  # Permissions
  permission_handler: ^12.0.1

  # URL Launcher
  url_launcher: ^6.3.2

  # Local Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.3.1
  google_sign_in: ^7.2.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  firebase_app_check: ^0.4.6
  cloud_firestore: ^6.8.0
  file_picker: ^11.0.3
  in_app_purchase: ^3.3.1
  http: ^1.6.0
  firebase_messaging: ^16.6.0
  firebase_analytics: ^12.5.0
  cloud_functions: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/images/
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/fraudroko_app_icon.png"

dependency_overrides:
  firebase_core_web: 3.10.0
